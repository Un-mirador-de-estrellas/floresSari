<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores para mi hermosa Sari 🌸</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #ff69b4;
      background-image: linear-gradient(180deg, #ff69b4, #ffc0cb);
      font-family: 'Arial', sans-serif;
      text-align: center;
    }

    h1 {
      position: absolute;
      width: 100%;
      top: 20px;
      color: white;
      font-size: 2em;
      z-index: 5;
    }

    .fall {
      position: absolute;
      font-size: 25px;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      0% { transform: translateY(-50px); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    .plant {
      position: absolute;
      width: 4px;
      background: #228B22;
      height: 0;
      transition: height 2s ease-out, width 2s ease-out;
      z-index: 2;
    }

    .flower-head {
      position: absolute;
      font-size: 30px;
      transform: scale(0);
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: glow 2s infinite alternate;
      z-index: 3;
      will-change: transform, text-shadow;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px rgba(255, 255, 0, 0.7); }
      to { text-shadow: 0 0 20px rgba(255, 215, 0, 1); }
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: gold;
      border-radius: 50%;
      animation: spark 1s linear forwards;
    }

    @keyframes spark {
      to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
      }
    }

    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      background: yellow;
      border-radius: 50%;
      animation: explode 1s ease-out forwards;
    }

    @keyframes explode {
      to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
      }
    }

    .cat {
      position: absolute;
      bottom: 0;
      font-size: 60px;
      left: -100px;
      z-index: 4;
    }

    #btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 25px;
      font-size: 1.2em;
      background: #ff1493;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      color: black;
      padding: 20px;
      border-radius: 20px;
      width: 80%;
      max-width: 300px;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      z-index: 10;
      white-space: pre-line;
    }

    .popup button {
      margin-top: 15px;
      padding: 10px;
      border: none;
      background: #ff69b4;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<button id="btn">Ábrelo mi vida hermosa 💌</button>
<h1 id="title"></h1>

<div class="cat" id="cat">🐱</div>

<div class="popup" id="popup">
  <span id="letterText"></span>
  <button onclick="closePopup()">Cerrar</button>
</div>

<audio id="music" src="prueba.mp3"></audio>

<script>
  const btn = document.getElementById('btn');
  const title = document.getElementById('title');
  const cat = document.getElementById('cat');
  const music = document.getElementById('music');
  const popup = document.getElementById('popup');
  const letterText = document.getElementById('letterText');

  const letterContent = `💛 Para mi Sari hermosa 💛\n\nGracias por existir, por tu sonrisa, \nPor tus hermosos ojos \nPor permitirme conocerte y formar parte de tu vida \nSiempre siempre te amare con todo mi corazon 🌼🐱 \nMi esposa hermosa y ya que no pude \nEntregarte tus flores hoy, espero te gusten estas mi vida`;

  function typeName(name) {
    title.innerHTML = '';
    name.split('').forEach((l, i) => {
      const span = document.createElement('span');
      span.textContent = l;
      span.style.opacity = 0;
      span.style.animation = `appear 0.5s forwards ${i*0.3}s`;
      title.appendChild(span);
    });
  }

  function typeLetter(text) {
    letterText.textContent = '';
    let i = 0;
    const interval = setInterval(() => {
      letterText.textContent += text[i];
      i++;
      if (i >= text.length) clearInterval(interval);
    }, 40);
  }

  function createFalling() {
    const items = ['🌼','💖','🐱'];
    const el = document.createElement('div');
    el.classList.add('fall');
    el.innerHTML = items[Math.floor(Math.random()*items.length)];
    el.style.left = Math.random()*window.innerWidth + 'px';
    el.style.animationDuration = (3 + Math.random()*5)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),8000);
  }

  function createSpark(x, y) {
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.classList.add('spark');
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.setProperty('--x', (Math.random()-0.5)*100 + 'px');
      s.style.setProperty('--y', (Math.random()-0.5)*100 + 'px');
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1000);
    }
  }

  function createFirework(x, y) {
    for (let i = 0; i < 20; i++) {
      const fw = document.createElement('div');
      fw.classList.add('firework');
      fw.style.left = x + 'px';
      fw.style.top = y + 'px';
      fw.style.setProperty('--x', (Math.random()-0.5)*300 + 'px');
      fw.style.setProperty('--y', (Math.random()-0.5)*300 + 'px');
      document.body.appendChild(fw);
      setTimeout(()=>fw.remove(),1000);
    }
  }

  function createBouquet(x, y, scale=1) {
    for (let i = 0; i < 12; i++) {
      const flower = document.createElement('div');
      flower.classList.add('flower-head');
      flower.innerHTML = '🌼';

      const offsetX = (Math.random() - 0.5) * 60 * scale;
      const offsetY = Math.random() * 60 * scale;

      flower.style.left = (x + offsetX) + 'px';
      flower.style.top = (y - offsetY) + 'px';
      flower.style.fontSize = (30 * scale) + 'px';

      document.body.appendChild(flower);

      setTimeout(()=> flower.style.transform = 'scale(1)', 100);
    }
    createSpark(x, y);
  }

  function createPlant(x, origin, scale=1) {
    const plant = document.createElement('div');
    plant.classList.add('plant');

    const size = (100 + Math.random()*80) * scale;

    let endX = x;
    let endY = window.innerHeight;

    if (origin === 'bottom') {
      plant.style.bottom = 0;
      plant.style.left = x + 'px';
      setTimeout(()=> plant.style.height = size + 'px', 50);
      endY = window.innerHeight - size;
    }

    if (origin === 'top') {
      plant.style.top = 0;
      plant.style.left = x + 'px';
      setTimeout(()=> plant.style.height = size + 'px', 50);
      endY = size;
    }

    if (origin === 'left') {
      plant.style.left = 0;
      plant.style.top = x + 'px';
      plant.style.height = '4px';
      setTimeout(()=> plant.style.width = size + 'px', 50);
      endX = size;
      endY = x;
    }

    if (origin === 'right') {
      plant.style.right = 0;
      plant.style.top = x + 'px';
      plant.style.height = '4px';
      setTimeout(()=> plant.style.width = size + 'px', 50);
      endX = window.innerWidth - size;
      endY = x;
    }

    document.body.appendChild(plant);

    setTimeout(()=>{
      createBouquet(endX, endY, scale);
    }, 2000);
  }

  function closePopup() {
    popup.style.display = 'none';
  }

  btn.onclick = () => {
    btn.style.display = 'none';
    typeName('Para Sari 💛');
    
    music.play().catch(e => console.log("Audio bloqueado temporalmente por el navegador"));

    const origins = ['bottom','top','left','right'];

    // AQUÍ ESTÁ LA MAGIA: 150 tallos, pero mucho más espaciados en el tiempo
    for(let i=0;i<150;i++){
      setTimeout(()=>{
        const x = Math.random()*window.innerWidth;
        const origin = origins[Math.floor(Math.random()*origins.length)];
        const scale = Math.random()*0.8 + 0.6;
        createPlant(x, origin, scale);
      }, i * 350); // Aumentado a 350ms. Tomará casi un minuto llenar la pantalla.
    }

    let pos = 0;
    const walk = setInterval(()=>{
      pos += 15;
      cat.style.left = pos+'px';
      if(pos > window.innerWidth*0.5){
        clearInterval(walk);

        createBouquet(pos, window.innerHeight-100, 1.5);

        setTimeout(() => {
          popup.style.display = 'block';
          typeLetter(letterContent);

          for(let i=0;i<6;i++){
            setTimeout(()=>{
              createFirework(Math.random()*window.innerWidth, Math.random()*window.innerHeight/2);
            }, i*300);
          }

        }, 1500);
      }
    },100);

    // Caída de elementos ajustada a 600ms para liberar memoria
    setInterval(createFalling, 600); 
  }
</script>

</body>
</html>
